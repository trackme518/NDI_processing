name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        variant: [allinone, system-runtime]
        platform:
          - os: ubuntu-latest
            id: linux-x86-64
          - os: macos-latest
            # universal build: bundles arm64 + x86-64 slices, runs on Intel Macs too
            id: macos
          - os: windows-latest
            id: windows-x86-64

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up MSVC developer environment
        if: matrix.platform.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup the NDI SDK (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          wget https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v5_Linux.tar.gz && tar -xvf Install_NDI_SDK_v5_Linux.tar.gz
          sed -i 's/read -p/cat/g' Install_NDI_SDK_v5_Linux.sh
          PAGER=cat REPLY=y ./Install_NDI_SDK_v5_Linux.sh
          echo "NDI_SDK_DIR=$PWD/NDI SDK for Linux" >> "$GITHUB_ENV"

      - name: Setup the NDI SDK (macOS)
        if: startsWith(matrix.platform.os, 'macos')
        run: |
          brew install p7zip
          wget https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v5_macOS.pkg
          7z x Install_NDI_SDK_v5_macOS.pkg
          7z x Payload~
          mv "NDI SDK for macOS" "NDI SDK for Apple"
          rm Install_NDI_SDK_v5_macOS.pkg Payload~

      - name: Setup the NDI SDK (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.ndi.tv/SDK/NDI_SDK/NDI%205%20SDK.exe -OutFile "NDI 5 SDK.exe"
          # Bundled 7-Zip cannot unpack this Inno Setup 6.1 installer; use innoextract instead
          Invoke-WebRequest https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip -OutFile innoextract.zip
          Expand-Archive innoextract.zip -DestinationPath innoextract
          ./innoextract/innoextract.exe --extract --output "NDI SDK for Windows" "NDI 5 SDK.exe"
          Remove-Item "NDI 5 SDK.exe", "innoextract.zip"
          # The installer payload lives under the Inno Setup "app" directory
          echo "NDI_SDK_DIR=$PWD/NDI SDK for Windows/app" >> $env:GITHUB_ENV

      - name: Grant execute permission for gradlew
        if: matrix.platform.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Build release artifacts
        run: ./gradlew buildReleaseArtifacts "-PgithubReleaseTag=${{ github.ref_name }}" "-Pvariant=${{ matrix.variant }}"

      - name: Rename per-platform artifacts
        shell: pwsh
        run: |
          Move-Item release/NDI_p5-${{ matrix.variant }}.zip release/NDI_p5-${{ matrix.platform.id }}-${{ matrix.variant }}.zip
          Move-Item release/NDI_p5-${{ matrix.variant }}.pdex release/NDI_p5-${{ matrix.platform.id }}-${{ matrix.variant }}.pdex

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/NDI_p5-${{ matrix.platform.id }}-${{ matrix.variant }}.zip
            release/NDI_p5-${{ matrix.platform.id }}-${{ matrix.variant }}.pdex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  universal:
    name: Bundle universal libraries
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Merge per-platform jars into one universal library per variant
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'NDI_p5-*.zip' -D dl
          for variant in allinone system-runtime; do
            rm -rf work all tmp-linux tmp-windows; mkdir -p work all
            # macOS is the base (its jar already carries arm64 + x86-64 slices).
            unzip -oq "dl/NDI_p5-macos-${variant}.zip" -d work
            jar="$(pwd)/work/NDI_p5/library/NDI_p5.jar"
            for p in linux windows; do
              case "$p" in linux) pkg=linux-x86-64;; windows) pkg=windows-x86-64;; esac
              unzip -oq "dl/NDI_p5-${pkg}-${variant}.zip" NDI_p5/library/NDI_p5.jar -d "tmp-${p}"
              unzip -oq "tmp-${p}/NDI_p5/library/NDI_p5.jar" 'natives/*' -d all
            done
            # One jar with natives/macos + natives/linux + natives/windows;
            # NDIP5.java extracts the slice matching the running OS/arch.
            # allinone natives include the bundled NDI runtime; system-runtime ships only ours.
            (cd all && zip -q -r -u "$jar" natives)
            (cd work && zip -qr "../NDI_p5-${variant}.zip" NDI_p5)
            cp "NDI_p5-${variant}.zip" "NDI_p5-${variant}.pdex"
            gh release upload "$TAG" "NDI_p5-${variant}.zip" "NDI_p5-${variant}.pdex" -R "$GITHUB_REPOSITORY" --clobber
          done
          # Stable-name artifacts for the Processing Contribution Manager:
          # NDI_p5.txt + NDI_p5.zip must keep the same URL across releases.
          # The default allinone build is registered.
          unzip -oq NDI_p5-allinone.zip NDI_p5/library.properties -d stab
          cp stab/NDI_p5/library.properties NDI_p5.txt
          cp NDI_p5-allinone.zip NDI_p5.zip
          gh release upload "$TAG" NDI_p5.zip NDI_p5.txt -R "$GITHUB_REPOSITORY" --clobber
      - name: Remove per-platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for id in macos linux-x86-64 windows-x86-64; do
            for variant in allinone system-runtime; do
              for ext in zip pdex; do
                gh release delete-asset "$TAG" "NDI_p5-$id-$variant.$ext" -R "$GITHUB_REPOSITORY" --yes
              done
            done
          done
