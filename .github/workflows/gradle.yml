name: Java CI with Gradle

on: [ push, pull_request ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            id: linux-x86-64
          - os: macos-13
            id: macos-x86-64
          - os: macos-latest
            id: macos-arm64
          - os: windows-latest
            id: windows-x86-64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up MSVC developer environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup the NDI SDK (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz && tar -xvf Install_NDI_SDK_v6_Linux.tar.gz
          sed -i 's/read -p/cat/g' Install_NDI_SDK_v6_Linux.sh
          PAGER=cat REPLY=y ./Install_NDI_SDK_v6_Linux.sh
          echo "NDI_SDK_DIR=$PWD/NDI SDK for Linux" >> "$GITHUB_ENV"

      - name: Setup the NDI SDK (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install p7zip
          wget https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg
          7z x Install_NDI_SDK_v6_Apple.pkg
          7z x Payload~
          [ -d "NDI SDK for macOS" ] && mv "NDI SDK for macOS" "NDI SDK for Apple" || true
          rm Install_NDI_SDK_v6_Apple.pkg Payload~

      - name: Setup the NDI SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe -OutFile "NDI SDK.exe"
          # Bundled 7-Zip cannot unpack this Inno Setup installer; use innoextract instead
          Invoke-WebRequest https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip -OutFile innoextract.zip
          Expand-Archive innoextract.zip -DestinationPath innoextract
          ./innoextract/innoextract.exe --extract --output "NDI SDK for Windows" "NDI SDK.exe"
          Remove-Item "NDI SDK.exe", "innoextract.zip"
          echo "NDI_SDK_DIR=$PWD/NDI SDK for Windows/app" >> $env:GITHUB_ENV

      - name: Grant execute permission for gradlew
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devolay-${{ matrix.id }}
          path: build/libs/*.jar
