# More on this file here: https://github.com/processing/processing/wiki/Library-Basics
# UTF-8 supported.

# The name of your Library as you want it formatted.
name=NDI Stream for Processing

# A version number that increments once with each release. This is used to
# compare different versions of the same Library, and check if an update is
# available. You should think of it as a counter, counting the total number of
# releases you've had. NOTE: This must be parsable as an int!
version=1

# The version of your library. It usually follows semantic versioning (semver),
# which uses three numbers separated by dots: "MAJOR.MINOR.PATCH" (e.g., "1.0.0").
#
# Note: The prettyVersion value defined here can be overwritten by a GitHub release tag.
prettyVersion=4.0.0

# List of authors. Links can be provided using the syntax [author name](url).
authors=[Vojtech Leischner](https://github.com/trackme518), [Walker Knapp](https://walkerknapp.me)

# A web page for your Library, NOT a direct link to where to download it.
url=https://github.com/trackme518/NDI_processing

# The category (or categories) of your Library, must be from the following list:
#   "3D"            "Animation"     "Compilations"      "Data"
#   "Fabrication"   "Geometry"      "GUI"               "Hardware"
#   "I/O"           "Language"      "Math"              "Simulation"
#   "Sound"         "Utilities"     "Typography"        "Video & Vision"
categories=Video & Vision

# A short sentence (or fragment) to summarize the Library's function.
sentence=Sends and receives video and audio over the network using NewTek's NDI(tm) protocol.

# Additional information suitable for the Processing website.
paragraph=NDIStream wraps the [NDI(tm) SDK](https://www.newtek.com/ndi/) so Processing sketches can act as NDI senders, receivers, finders and routers with no video-capture hardware required. NDI sources from other applications (NDI Screen Capture, OBS, vMix, TriCasters, and more) can be received as PImage video and audio, and Processing visuals can be transmitted as NDI sources. The NDI(tm) runtimes and native bindings are bundled in the library for macOS (Apple Silicon and Intel). Linux and Windows builds require the NDI runtime to be installed or bundled at build time.

# Links in the 'sentence' and 'paragraph' attributes can be inserted using the
# same syntax as for authors.

# The min and max revision of Processing compatible with your Library.
minRevision=0
maxRevision=0
